name: "VulnBox Sandboxed Security Scan"
description: "Run air-gapped SAST, lockfile CVE reachability (OpenVEX/CycloneDX VEX), and memory leak analysis with SARIF 2.1.0 upload."
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Repository directory to scan"
    required: false
    default: "."
  fail-on:
    description: "Fail the workflow if findings meet or exceed severity (low, medium, high, critical)"
    required: false
    default: "high"
  baseline:
    description: "Optional baseline JSON path to suppress accepted findings"
    required: false
    default: ""
  deep:
    description: "Enable --deep runtime call-graph tracing & memory/FD leak probing. WARNING: NEVER enable with pull_request_target because --deep executes the PR repository's code."
    required: false
    default: "false"
  sync-advisories:
    description: "Sync OSV.dev + CISA KEV + EPSS offline advisory cache before scanning"
    required: false
    default: "true"
  upload-sarif:
    description: "Upload findings.sarif.json to GitHub Code Scanning"
    required: false
    default: "true"
  out-dir:
    description: "Output directory for report bundle (report.md, findings.sarif.json, openvex.json, cyclonedx.vex.json)"
    required: false
    default: "vulnbox-out"

outputs:
  sarif-path:
    description: "Path to the generated SARIF 2.1.0 report"
    value: ${{ steps.scan.outputs.sarif_path }}
  openvex-path:
    description: "Path to the generated OpenVEX v0.2.0 report"
    value: ${{ steps.scan.outputs.openvex_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install VulnBox
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python3 -m pip install --quiet "$ACTION_PATH"

    - name: Sync offline advisory cache (OSV + KEV + EPSS)
      if: ${{ inputs.sync-advisories == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: vulnbox sync-advisories "$INPUT_PATH"

    - name: Run VulnBox scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_DEEP: ${{ inputs.deep }}
      run: |
        ARGS=("scan" "$INPUT_PATH" "--backend" "local" "--out" "$INPUT_OUT_DIR")
        if [ -n "$INPUT_FAIL_ON" ]; then
          ARGS+=("--fail-on" "$INPUT_FAIL_ON")
        fi
        if [ -n "$INPUT_BASELINE" ]; then
          ARGS+=("--baseline" "$INPUT_BASELINE")
        fi
        if [ "$INPUT_DEEP" = "true" ]; then
          ARGS+=("--deep")
        fi
        set +e
        vulnbox "${ARGS[@]}"
        SCAN_RC=$?
        set -e
        SARIF=$(find "$INPUT_OUT_DIR" -name "findings.sarif.json" | head -n 1)
        VEX=$(find "$INPUT_OUT_DIR" -name "openvex.json" | head -n 1)
        {
          echo "sarif_path=${SARIF}"
          echo "openvex_path=${VEX}"
        } >> "$GITHUB_OUTPUT"
        exit "$SCAN_RC"

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif_path != '' }}
      uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_path }}
